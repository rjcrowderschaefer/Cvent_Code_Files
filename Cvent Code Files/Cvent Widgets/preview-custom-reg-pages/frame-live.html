  .pb li[aria-current] span.c { background: #fff; border: 3px solid #F7A325; }
  .pb .bar { position: absolute; width: calc(100% - 28px); margin-left: 14px; height: 8px; top: 11px; left: -50%; background: #000; }

  input[class*=TextInput__textbox] { display: block; width: 100%; height: 44px; background: #191919; border: 1px solid #555; color: #fff; margin-bottom: 5px; box-sizing: border-box; }
  .left-align-fields input[data-cvent-id=input] { width: 60% !important; }

  button#exit { background: #e7e8e8; }
  .site-footer { background: #000; color: #999; padding: 40px 24px; border-top: 3px solid #F7A325; }
  #slot-banner:empty { display: none; }
</style>
